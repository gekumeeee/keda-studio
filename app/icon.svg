<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- KEDA favicon: the single isometric block from the brand logomark
       (paths 3 and 4 of public/brand/keda-logomark-black.svg — the outer
       frame and the slot cut into its face), on a plain white disc.

       Vector, not the 2000px PNG of the same mark: it stays crisp at every
       size a browser asks for and costs a couple of KB. The white disc is
       what makes it work in both tab themes — the black mark carries a
       light tab, the disc carries a dark one. -->
